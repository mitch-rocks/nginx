
# RustFS S3 API
server {
    listen 80;
    server_name s3.mitch.rocks;

    resolver 127.0.0.11 valid=10s;

    set $rustfs_s3_upstream rustfs:9000;

    location / {
        proxy_pass http://$rustfs_s3_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 0;
    }
}


# RustFS Web Console
server {
    listen 80;
    server_name rustfs.mitch.rocks;

    resolver 127.0.0.11 valid=10s;

    set $rustfs_console_upstream rustfs:9001;

    location / {
        proxy_pass http://$rustfs_console_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

